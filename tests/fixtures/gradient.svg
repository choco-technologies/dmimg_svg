<svg xmlns="http://www.w3.org/2000/svg" width="20" height="4">
  <defs>
    <linearGradient id="fractions" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="percents" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#0000ff"/>
    </linearGradient>
  </defs>
  <!-- The same gradient across each rect: in fractions of its box, in percents -->
  <rect x="0" y="0" width="20" height="2" fill="url(#fractions)"/>
  <rect x="0" y="2" width="20" height="2" fill="url(#percents)"/>
</svg>
